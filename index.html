<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hex Corruptor</title>
<style>
:root{color-scheme:dark;--bg:#0b0d12;--panel:#131722;--line:#252d3b;--muted:#929caf;--text:#edf2fa;--accent:#9b8cff;--accent2:#6c5ce7;--green:#70dfae}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#242044 0,transparent 55%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:28px}
main{width:min(720px,100%)}.eyebrow{color:var(--accent);font:700 11px/1.2 ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;margin-bottom:12px}h1{font-size:clamp(30px,6vw,46px);letter-spacing:-.045em;line-height:1.05;margin:0 0 10px}.sub{color:var(--muted);margin:0 0 26px}.card{background:linear-gradient(160deg,#171d2a,#111620);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 22px 70px #0006}.drop{display:block;border:1px dashed #46506a;border-radius:12px;padding:25px;text-align:center;background:#0e131d;cursor:pointer;transition:.2s}.drop:hover,.drop.drag{border-color:var(--accent);background:#17162a}.drop strong{display:block;font-size:16px}.drop span{color:var(--muted);font-size:13px}.filemeta{display:none;margin-top:14px;padding:12px 14px;background:#0d121b;border:1px solid var(--line);border-radius:10px;font:12px ui-monospace,monospace;color:#c8d0df;overflow-wrap:anywhere}.controls{margin-top:26px}.labelrow{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:13px}.labelrow label{font-weight:650}.hint{color:var(--muted);font-size:12px}.sliderrow{display:grid;grid-template-columns:minmax(0,1fr) 116px;gap:16px;align-items:center}input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}input[type=number]{width:100%;background:#0c111a;border:1px solid #394256;border-radius:9px;color:var(--text);padding:10px 11px;font:600 15px ui-monospace,monospace;outline:none}input[type=number]:focus{border-color:var(--accent)}.rangeends{display:flex;justify-content:space-between;color:var(--muted);font:11px ui-monospace,monospace;margin-top:5px}.keep{margin-top:20px;padding:12px 14px;border-radius:10px;background:#101d1b;border:1px solid #254a3c;color:#a6e9ca;font-size:13px}.actions{display:flex;gap:12px;margin-top:22px}.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;font-size:14px;cursor:pointer}.primary{background:var(--accent);color:#100d20;flex:1}.primary:hover{background:#b0a5ff}.primary:disabled{opacity:.35;cursor:not-allowed}.secondary{background:#242b3a;color:#dce3f0}.status{min-height:22px;color:var(--muted);font-size:12px;margin-top:14px}.status.ok{color:var(--green)}footer{margin-top:16px;text-align:center;color:#657086;font-size:11px}code{font-family:ui-monospace,monospace;color:#c7bbff}@media(max-width:520px){.card{padding:18px}.sliderrow{grid-template-columns:minmax(0,1fr) 94px}.actions{flex-direction:column}}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Binary file utility · client-side</div>
  <h1>Hex Corruptor<span style="color:var(--accent)">.</span></h1>
  <p class="sub">Randomly alter bytes in a file and download the corrupted copy.</p>
  <section class="card">
    <label class="drop" id="drop" for="file"><strong>Choose a file or drop it here</strong><span>Any file type · processed locally in your browser</span></label>
    <input id="file" type="file" hidden>
    <div class="filemeta" id="filemeta"></div>
    <div class="controls">
      <div class="labelrow"><label for="amount">Bytes to corrupt</label><span class="hint">Slider + exact value</span></div>
      <div class="sliderrow">
        <input id="slider" type="range" min="0" max="0" value="0" disabled>
        <input id="amount" type="number" min="0" max="0" value="0" disabled aria-label="Number of bytes to corrupt">
      </div>
      <div class="rangeends"><span>0 bytes</span><span id="maxlabel">0 bytes max</span></div>
    </div>
    <div class="keep">🔒 First 50 bytes are protected and will never be modified.</div>
    <div class="actions"><button class="btn primary" id="go" disabled>Corrupt &amp; download</button><button class="btn secondary" id="reset" type="button">Reset</button></div>
    <div class="status" id="status" role="status">Select a file to get started.</div>
  </section>
  <footer>No upload · no server · original file is never changed</footer>
</main>
<script>
const fileInput=document.getElementById('file'),drop=document.getElementById('drop'),slider=document.getElementById('slider'),amount=document.getElementById('amount'),go=document.getElementById('go'),reset=document.getElementById('reset'),meta=document.getElementById('filemeta'),status=document.getElementById('status'),maxlabel=document.getElementById('maxlabel');
let selectedFile=null;
const fmt=n=>n.toLocaleString()+' bytes';
function setCount(v){const max=Number(amount.max)||0;const n=Math.max(0,Math.min(max,Math.floor(Number(v)||0)));slider.value=String(n);amount.value=String(n);go.disabled=!selectedFile||n===0;}
function loadFile(file){if(!file)return;selectedFile=file;const max=Math.max(0,file.size-50);slider.max=amount.max=String(max);slider.disabled=amount.disabled=max===0;maxlabel.textContent=fmt(max)+' max';meta.style.display='block';meta.textContent=file.name+'  ·  '+fmt(file.size)+'  ·  '+(file.type||'unknown type');setCount(Math.min(1,max));status.className='status';status.textContent=max?'Ready. Up to '+fmt(max)+' can be changed.':'This file is 50 bytes or smaller, so there are no bytes available to corrupt.';}
slider.addEventListener('input',()=>setCount(slider.value));amount.addEventListener('input',()=>setCount(amount.value));fileInput.addEventListener('change',()=>loadFile(fileInput.files[0]));
for(const ev of ['dragenter','dragover'])drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')});for(const ev of ['dragleave','drop'])drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')});drop.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));
reset.addEventListener('click',()=>{selectedFile=null;fileInput.value='';meta.style.display='none';slider.max=amount.max='0';slider.disabled=amount.disabled=true;setCount(0);maxlabel.textContent='0 bytes max';status.className='status';status.textContent='Select a file to get started.';});
go.addEventListener('click',async()=>{if(!selectedFile)return;const count=Number(amount.value);if(!count)return;go.disabled=true;status.className='status';status.textContent='Reading and modifying file…';try{const bytes=new Uint8Array(await selectedFile.arrayBuffer());const available=bytes.length-50;if(count>available)throw new Error('Requested byte count exceeds the available bytes.');
// Partial Fisher-Yates sampling guarantees unique positions without allocating a huge Set.
const positions=new Uint32Array(available);for(let i=0;i<available;i++)positions[i]=i+50;
for(let i=0;i<count;i++){const random=new Uint32Array(1);crypto.getRandomValues(random);const j=i+(random[0]%(available-i));const tmp=positions[i];positions[i]=positions[j];positions[j]=tmp;const pos=positions[i];const old=bytes[pos];let next;do{crypto.getRandomValues(random);next=random[0]&255;}while(next===old);bytes[pos]=next;}
const blob=new Blob([bytes],{type:'application/octet-stream'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=selectedFile.name+'.corrupted';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);status.className='status ok';status.textContent='Done — '+fmt(count)+' changed. Bytes 0–49 were preserved. Download started.';
}catch(err){status.className='status';status.textContent='Error: '+err.message;}finally{go.disabled=Number(amount.value)===0||!selectedFile;}});
</script>
</body>
</html>
